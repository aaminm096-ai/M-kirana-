name: Build MANSURI KIRANA APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Create TWA project
        run: |
          mkdir twa
          cd twa
          bubblewrap init --manifest https://aaminm096-ai.github.io/M-kirana-/manifest.json

      - name: Build APK
        working-directory: twa
        run: yes | bubblewrap build

      - name: Find APK
        run: find . -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MANSURI-KIRANA-APK
          path: twa/**/*.apk
